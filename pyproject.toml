[project]
name = "ma-app"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.74.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ty>=0.0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: pure-logic tests, no DB or network",
    "integration: tests that hit the live SQL warehouse / FastAPI app",
    "acceptance: one test per customer requirement (see §15.9)",
]
addopts = "-ra"

[tool.apx.metadata]
app-name = "ma-app"
app-slug = "ma_app"
app-entrypoint = "ma_app.backend.app:app"
api-prefix = "/api"
metadata-path = "src/ma_app/_metadata.py"

[tool.apx.ui]
root = "src/ma_app/ui"

[tool.apx.ui.registries]
"@animate-ui" = "https://animate-ui.com/r/{name}.json"
"@ai-elements" = "https://registry.ai-sdk.dev/{name}.json"
"@svgl" = "https://svgl.app/r/{name}.json"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.version]
path = "src/ma_app/_version.py"
template = '''
version = "{version}"
'''

[tool.hatch.build]
artifacts = ["src/ma_app/__dist__", "src/ma_app/_metadata.py"]
exclude = ["src/ma_app/ui"]
