bundle:
  name: ma-app

include:
  - resources/*.yml

# All workspace-specific values are variables (overridable per target / via --var).
variables:
  target_catalog:
    description: Catalog holding App-owned Delta tables.
    default: ma_app_demo
  app_schema:
    description: Schema for App-owned operational tables.
    default: ma_app
  warehouse_id:
    description: SQL Warehouse id used by the App and setup job.
    default: ""
  audience_source_mode:
    description: local_snapshot or shared_table.
    default: local_snapshot

sync:
  include:
    - .build
    # Generated by `apx build` (gitignored) but required when the setup/seed job runs
    # from synced source. Force-sync so `import ma_app` resolves on the job.
    - src/ma_app/_metadata.py
    - src/ma_app/_version.py

artifacts:
  default:
    build: apx build

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: DEFAULT
    variables:
      target_catalog: ma_app_demo
      app_schema: ma_app
      warehouse_id: ""
      audience_source_mode: local_snapshot
